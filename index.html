<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temel Web Sitesi</title>
    <!-- CSS dosyamızı bağlıyoruz -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Hoş Geldiniz!</h1>

        <button id="renkButonu">Arka Plan Rengini Değiştir</button>

        </div>

    <!-- JavaScript dosyamızı bağlıyoruz -->
    <script src="script.js"></script>
